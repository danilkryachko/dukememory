name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install pinned CycloneDX generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate and validate CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --all-features --target all --spec-version 1.5 --override-filename dukememory.cdx
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' dukememory.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dukememory-sbom
          path: dukememory.cdx.json
          if-no-files-found: error

  supply-chain-gate:
    if: always()
    needs: [cargo-deny, dependency-review, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Require supply-chain jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CARGO_DENY_RESULT: ${{ needs.cargo-deny.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
        run: |
          test "${CARGO_DENY_RESULT}" = success
          test "${SBOM_RESULT}" = success
          if [[ "${EVENT_NAME}" = pull_request ]]; then
            test "${DEPENDENCY_REVIEW_RESULT}" = success
          else
            test "${DEPENDENCY_REVIEW_RESULT}" = skipped
          fi
