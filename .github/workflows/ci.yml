name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DUKEMEMORY_EMBED_PROVIDER: mock
  DUKEMEMORY_GEN_PROVIDER: mock

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test default features
        run: cargo test
      - name: Test sqlite-vec capability build
        run: cargo test --features vec
      - name: Check local generation build
        run: cargo check --features local-embeddings,local-generation
