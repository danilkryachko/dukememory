name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DUKEMEMORY_EMBED_PROVIDER: mock
  DUKEMEMORY_GEN_PROVIDER: mock

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Package verification
        run: cargo package --locked
      - name: Release quality gate
        run: |
          cargo fmt --all -- --check
          scripts/dependency-budget.sh
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --features vec
          cargo test --locked --test performance -- --ignored --nocapture
      - name: Verify byte-reproducible minimal profile
        run: scripts/reproducible-build-check.sh
      - name: Release supply-chain gate
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  sbom:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Generate CycloneDX release SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --all-features --target all --spec-version 1.5 --override-filename dukememory.cdx
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' dukememory.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dukememory-sbom
          path: dukememory.cdx.json
          if-no-files-found: error

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: dukememory-x86_64-unknown-linux-gnu
            binary: dukememory
            checksum: sha256sum
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: dukememory-aarch64-unknown-linux-gnu
            binary: dukememory
            checksum: sha256sum
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: dukememory-x86_64-unknown-linux-musl
            binary: dukememory
            checksum: sha256sum
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: dukememory-aarch64-apple-darwin
            binary: dukememory
            checksum: shasum
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: dukememory-x86_64-apple-darwin
            binary: dukememory
            checksum: shasum
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dukememory-x86_64-pc-windows-msvc
            binary: dukememory.exe
            checksum: sha256sum
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        shell: bash
        run: cargo build --locked --release --features vec --target "${{ matrix.target }}"
      - name: Enforce full binary size budget
        shell: bash
        run: scripts/binary-size-budget.sh "target/${{ matrix.target }}/release/${{ matrix.binary }}" 57671680
      - name: Smoke-test installed binary
        shell: bash
        run: scripts/release-smoke.sh "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${GITHUB_REF_NAME#v}"
      - name: Package artifact and checksum
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.asset }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}/"
          cp README.md CHANGELOG.md LICENSE TRADEMARKS.md "dist/${{ matrix.asset }}/"
          tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          if [[ "${{ matrix.checksum }}" = "sha256sum" ]]; then
            cd dist
            sha256sum "${{ matrix.asset }}.tar.gz" >"${{ matrix.asset }}.sha256"
          else
            cd dist
            shasum -a 256 "${{ matrix.asset }}.tar.gz" >"${{ matrix.asset }}.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  build-minimal:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build minimal local-first binary
        run: >-
          cargo build --locked --profile release-minimal --no-default-features --features vec
          --target x86_64-unknown-linux-gnu
      - name: Enforce minimal binary size budget
        run: >-
          scripts/binary-size-budget.sh
          target/x86_64-unknown-linux-gnu/release-minimal/dukememory
          12582912
      - name: Smoke-test minimal binary
        run: >-
          scripts/release-smoke.sh
          target/x86_64-unknown-linux-gnu/release-minimal/dukememory
          "${GITHUB_REF_NAME#v}"
      - name: Package minimal artifact and checksum
        run: |
          asset=dukememory-minimal-x86_64-unknown-linux-gnu
          mkdir -p "dist/${asset}"
          cp target/x86_64-unknown-linux-gnu/release-minimal/dukememory "dist/${asset}/"
          cp README.md CHANGELOG.md LICENSE TRADEMARKS.md "dist/${asset}/"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          cd dist
          sha256sum "${asset}.tar.gz" >"${asset}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dukememory-minimal-x86_64-unknown-linux-gnu
          path: |
            dist/dukememory-minimal-x86_64-unknown-linux-gnu.tar.gz
            dist/dukememory-minimal-x86_64-unknown-linux-gnu.sha256
          if-no-files-found: error

  github-release:
    needs: [build, build-minimal, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Build combined checksum manifest
        run: |
          cd dist
          sha256sum dukememory.cdx.json >dukememory.cdx.json.sha256
          cat ./*.sha256 | sort >SHA256SUMS
      - name: Attest final release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
            dist/dukememory.cdx.json
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS dist/dukememory.cdx.json
          --verify-tag
          --generate-notes
          --title "dukememory ${GITHUB_REF_NAME#v}"

  crates-io:
    needs: github-release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Request a short-lived crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked
