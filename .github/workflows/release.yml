name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DUKEMEMORY_EMBED_PROVIDER: mock
  DUKEMEMORY_GEN_PROVIDER: mock

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Package verification
        run: cargo package --locked
      - name: Release quality gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked --features vec

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: dukememory-x86_64-unknown-linux-gnu
            checksum: sha256sum
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: dukememory-aarch64-apple-darwin
            checksum: shasum
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: dukememory-x86_64-apple-darwin
            checksum: shasum
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --features vec --target "${{ matrix.target }}"
      - name: Smoke-test installed binary
        run: scripts/release-smoke.sh "target/${{ matrix.target }}/release/dukememory" "${GITHUB_REF_NAME#v}"
      - name: Package artifact and checksum
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.asset }}"
          cp "target/${{ matrix.target }}/release/dukememory" "dist/${{ matrix.asset }}/"
          cp README.md LICENSE TRADEMARKS.md "dist/${{ matrix.asset }}/"
          tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          if [[ "${{ matrix.checksum }}" = "sha256sum" ]]; then
            cd dist
            sha256sum "${{ matrix.asset }}.tar.gz" >"${{ matrix.asset }}.sha256"
          else
            cd dist
            shasum -a 256 "${{ matrix.asset }}.tar.gz" >"${{ matrix.asset }}.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Build combined checksum manifest
        run: cat dist/*.sha256 | sort >dist/SHA256SUMS
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "dukememory ${GITHUB_REF_NAME#v}"

  crates-io:
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Require the repository publishing token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
