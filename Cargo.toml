[package]
name = "dukememory"
version = "0.43.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Local project memory for AI coding agents: durable context, SQLite, MCP, Codex skill, embeddings, and autonomous maintenance."
repository = "https://github.com/danilkryachko/dukememory"
readme = "README.md"
keywords = ["ai-agent", "memory", "mcp", "sqlite", "embeddings"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
age = { version = "0.12", default-features = false }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = { version = "3.5", features = ["termination"] }
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
sqlite-vec = "0.1.9"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rhai = { version = "1.22", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
time = { version = "0.3", features = ["formatting"] }
unicode-normalization = "0.1"
uuid = { version = "1.11", features = ["v4"] }
tract-onnx = { version = "0.23.3", optional = true }
tokenizers = { version = "0.23.1", optional = true }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"], optional = true }
encoding_rs = { version = "0.8.35", optional = true }
llama-cpp-2 = { version = "0.1.150", optional = true, features = ["sampler"] }

[features]
default = ["local-embeddings"]
# Keep the local-first default while allowing minimal builds with
# `--no-default-features` to omit the ONNX/tokenizer download stack.
local-embeddings = ["dep:hf-hub", "dep:tokenizers", "dep:tract-onnx"]
local-generation = ["dep:encoding_rs", "dep:hf-hub", "dep:llama-cpp-2"]
# The sqlite-vec module is always linked so databases created by accelerated
# builds remain writable by minimal builds. This feature enables KNN query and
# persistent index management; JSON fallback remains the default query path.
vec = []

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.11"
tempfile = "3.13"

# Install/update dry-runs hash large binaries. Optimizing SHA-256 keeps the
# extended CLI compatibility matrix fast without changing application code.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

# Release artifacts use one codegen unit and stripped symbols so the same
# locked toolchain/input set produces compact, byte-comparable binaries.
[profile.release]
codegen-units = 1
incremental = false
lto = "thin"
panic = "abort"
strip = "symbols"

# Opt-in footprint profile for servers that use FTS or external embeddings.
[profile.release-minimal]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "z"
